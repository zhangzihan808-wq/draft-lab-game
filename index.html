<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>拔模实验室｜离线小游戏</title>
  <style>
    :root{--bg:#07111b;--panel:#0d1c29;--panel2:#122638;--line:#27445a;--ink:#f4f8fb;--muted:#9fb3c4;--cyan:#40e0d0;--yellow:#ffbd59;--red:#ff5f73;--green:#68e19a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 8%,#123a54 0,transparent 32rem),var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:72px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-weight:900}.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--cyan);color:#07221f;font:bold 24px Georgia}.score{padding:9px 15px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.score b{color:var(--cyan);margin-left:8px}.page{width:min(1400px,calc(100% - 32px));margin:auto;padding:52px 0 70px;display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(36px,6vw,86px);align-items:center}.eyebrow{margin:0 0 15px;color:var(--cyan);font-size:13px;font-weight:900;letter-spacing:.16em}.copy h1{margin:0;font-size:clamp(50px,5.5vw,82px);line-height:1.04;letter-spacing:-.05em}.lead{max-width:560px;color:var(--muted);font-size:18px;line-height:1.7}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:25px}.level{min-height:68px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#0b1925;color:var(--muted);text-align:left;font-weight:800}.level span{display:block;font-size:10px;margin-bottom:5px}.level.active{background:var(--cyan);border-color:var(--cyan);color:#052421}.level.solved::after{content:" ✓";color:var(--green)}.level.active.solved::after{color:#073b35}.quiz{margin-top:16px;padding:17px;border:1px solid var(--line);border-radius:15px;background:#0b1925}.quiz small{color:var(--yellow);font-weight:900}.quiz p{margin:7px 0 12px;font-weight:800}.answers{display:flex;gap:8px}.answers button{flex:1;padding:10px;border:1px solid #34556b;border-radius:10px;background:#172c3d;color:var(--ink);font-weight:800}.answers button:hover{border-color:var(--cyan);color:var(--cyan)}.answers button:disabled{opacity:.45;cursor:default}.feedback{display:none;margin-top:11px;padding:10px;border-radius:9px;color:var(--muted);font-size:13px;line-height:1.5}.feedback.show{display:block}.feedback.good{border-left:3px solid var(--green);background:#102d27}.feedback.bad{border-left:3px solid var(--red);background:#321b25}.card{padding:25px;border:1px solid #315068;border-radius:26px;background:linear-gradient(145deg,#102535,#081621);box-shadow:0 28px 80px #0006}.card-head{display:flex;justify-content:space-between;gap:16px}.kicker{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.14em}.card h2{margin:6px 0 4px;font-size:25px}.sub{margin:0;color:var(--muted);font-size:13px}.status{height:max-content;padding:8px 12px;border-radius:999px;background:#182b3b;color:var(--muted);font-size:12px;font-weight:900}.status.bad{background:#3a1b27;color:var(--red)}.status.good{background:#123024;color:var(--green)}.stage{position:relative;height:350px;margin:18px 0 3px;display:grid;place-items:end center;overflow:hidden}.arrow{position:absolute;top:4px;left:50%;translate:-50%;display:grid;place-items:center;color:var(--cyan);font-size:12px;font-weight:900}.arrow i{display:block;width:4px;height:49px;margin-top:5px;background:var(--cyan);position:relative}.arrow i:before{content:"";position:absolute;top:-9px;left:50%;translate:-50%;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:14px solid var(--cyan)}.mold{position:relative;width:min(570px,90%);height:235px;border:2px solid #4c86a6;border-radius:14px 14px 23px 23px;background:#28516b;box-shadow:inset 0 0 0 15px #07111b22}.part{--lift:0px;position:absolute;left:50%;bottom:23px;translate:-50% calc(-1 * var(--lift));width:185px;height:188px;display:grid;place-items:center;z-index:3;background:var(--yellow);border:4px solid #ffd99a;color:#51360d;font-weight:900}.positive{clip-path:polygon(0 0,100% 0,82% 100%,18% 100%)}.negative{clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.undercut{width:155px;border-radius:7px}.hook{display:none;position:absolute;right:-56px;bottom:22px;width:60px;height:69px;background:var(--yellow);border:4px solid #ffd99a;border-left:0;border-radius:0 9px 9px 0}.undercut .hook{display:block}.sidehole{width:170px;border-radius:7px}.hole{display:none;position:absolute;left:50%;top:50%;translate:-50% -50%;width:64px;height:64px;border-radius:50%;background:var(--bg);border:4px solid #ffd99a}.sidehole .hole{display:block}.core{display:none;position:absolute;left:-32px;top:80px;width:calc(50% + 67px);height:55px;z-index:6;transition:translate .35s}.core.show{display:block}.core.open{translate:110%}.core i{position:absolute;left:0;right:0;top:18px;height:28px;border:3px solid #86a8bc;border-radius:99px;background:#08131d}.core span{color:#c1d1dc;font-size:11px;font-weight:900}.hit{position:absolute;z-index:8;opacity:0;background:var(--red);box-shadow:0 0 24px var(--red);border-radius:99px}.hit.lr{top:-6px;width:76px;height:21px}.hit.left{left:calc(50% - 111px)}.hit.right{right:calc(50% - 111px)}.hit.hook-hit{right:calc(50% - 125px);top:130px;width:27px;height:78px}.hit.pin-hit{left:50%;top:88px;translate:-50%;width:185px;height:36px}.stage.blocked.negative-scene .hit.lr,.stage.blocked.undercut-scene .hook-hit,.stage.blocked.sidehole-scene .pin-hit{opacity:1;animation:pulse .75s infinite alternate}@keyframes pulse{to{scale:1.13;filter:brightness(1.2)}}.core-btn{display:none;width:100%;margin:0 0 11px;padding:11px;border:1px solid #6b5830;border-radius:12px;background:#31291b;color:var(--yellow);font-weight:900}.core-btn.show{display:block}.core-btn.on{border-color:#2f7450;background:#102d23;color:var(--green)}.control{display:block;padding:15px 17px;border:1px solid var(--line);border-radius:14px;background:#07131d}.control div{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px}.control em{font-style:normal;color:var(--cyan);font-weight:900}.control input{width:100%;accent-color:var(--cyan)}.explain{margin-top:11px;padding:14px 16px;border-left:4px solid #49667b;border-radius:12px;background:var(--panel2);font-size:13px}.explain p{margin:5px 0 0;color:var(--muted);line-height:1.55}.explain.bad{border-color:var(--red);background:#321b25}.explain.good{border-color:var(--green);background:#102d23}.next{width:100%;margin-top:11px;padding:11px;border:0;border-radius:11px;background:var(--cyan);color:#06211f;font-weight:900}.note{grid-column:1/-1;margin-top:28px;padding:18px 22px;border:1px solid #6b5830;border-radius:15px;background:#282417;color:#e8d5a8;line-height:1.6}.note b{color:var(--yellow)}
    @media(max-width:950px){.page{grid-template-columns:1fr}.copy{text-align:center}.lead{margin-left:auto;margin-right:auto}.levels,.quiz{max-width:600px;margin-left:auto;margin-right:auto}}@media(max-width:600px){.page{width:calc(100% - 20px);padding-top:35px}.copy h1{font-size:46px}.levels{grid-template-columns:1fr 1fr}.answers{flex-direction:column}.card{padding:17px}.stage{height:315px}.mold{height:210px}.part{width:145px;height:165px}.undercut{width:125px}.hook{right:-45px;width:49px;height:58px}.sidehole{width:140px}.note{margin-top:8px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="logo">α</span><span>拔模实验室</span></div><div class="score">得分 <b id="score">0 / 4</b></div></header>
  <main class="page">
    <section class="copy">
      <p class="eyebrow">离线互动小游戏 · 注塑件入门</p>
      <h1>先判断，<br>再亲手拔一次。</h1>
      <p class="lead">四个典型结构，先猜能否直接脱模，再拖动滑杆验证。发生干涉的位置会标红。</p>
      <div class="levels" id="levels"></div>
      <div class="quiz"><small>先做判断</small><p>这个结构能沿主方向直接拔出吗？</p><div class="answers"><button data-answer="direct">可以直接拔</button><button data-answer="mechanism">需要侧向机构</button></div><div class="feedback" id="feedback"></div></div>
    </section>
    <section class="card">
      <div class="card-head"><div><span class="kicker" id="kicker">关卡 1 / 4</span><h2 id="title"></h2><p class="sub" id="subtitle"></p></div><span class="status" id="status">等待操作</span></div>
      <div class="stage" id="stage"><div class="arrow">主拔模方向<i></i></div><div class="mold"><div class="part" id="part">零件<span class="hook"></span><span class="hole"></span></div><div class="core" id="core"><span>侧芯</span><i></i></div><i class="hit lr left"></i><i class="hit lr right"></i><i class="hit hook-hit"></i><i class="hit pin-hit"></i></div></div>
      <button class="core-btn" id="coreButton">第一步：点击退出侧芯</button>
      <label class="control"><div><b id="pullLabel">向上拔模</b><em id="percent">0%</em></div><input id="slider" aria-label="拔模进度" type="range" min="0" max="100" value="0"></label>
      <div class="explain" id="explain"><b id="explainTitle">实验提示</b><p id="explainBody">拖动滑杆，观察零件与模具的相对运动。</p></div>
      <button class="next" id="next">下一关 →</button>
    </section>
    <aside class="note"><b>纠正：</b>当拔模方向向上时，“上宽下窄”会越拔越松，属于正拔模。真正的负拔模是“开口窄、内部宽”，内部宽肩无法穿过狭窄开口。</aside>
  </main>
  <script>
    const scenarios=[
      {id:'positive',tab:'正拔模',title:'开口宽、内部窄',sub:'顺着拔模方向，间隙越来越大',rule:'侧壁朝开口方向逐渐放宽，零件上移后立即与型腔脱离。',answer:'direct',stop:100},
      {id:'negative',tab:'负拔模',title:'开口窄、内部宽',sub:'宽肩被狭窄开口锁住',rule:'内部宽度大于开口宽度，宽肩无法穿过开口，这才是真正的负拔模。',answer:'mechanism',stop:27},
      {id:'undercut',tab:'倒扣',title:'侧面凸台勾住模具',sub:'反向台阶形成机械锁扣',rule:'侧面凸台超出主拔模轮廓，需要改结构、滑块或斜顶。',answer:'mechanism',stop:20},
      {id:'sidehole',tab:'横向孔',title:'侧芯横穿零件',sub:'孔轴与主拔模方向垂直',rule:'侧芯必须先横向抽走，再沿主方向顶出零件。',answer:'mechanism',stop:22}
    ];
    let index=0,pull=0,coreOpen=false,answered=false,score=0;const solved=new Set();
    const $=id=>document.getElementById(id);const levels=$('levels'),part=$('part'),stage=$('stage'),slider=$('slider'),status=$('status'),explain=$('explain'),core=$('core'),coreButton=$('coreButton');
    scenarios.forEach((s,i)=>{const b=document.createElement('button');b.className='level';b.innerHTML='<span>0'+(i+1)+'</span>'+s.tab;b.onclick=()=>select(i);levels.appendChild(b)});
    function select(i){index=i;pull=0;coreOpen=false;answered=false;slider.value=0;$('feedback').className='feedback';document.querySelectorAll('.answers button').forEach(b=>b.disabled=false);render()}
    function render(){const s=scenarios[index],can=s.id==='positive'||(s.id==='sidehole'&&coreOpen),blocked=!can&&pull>s.stop,visible=blocked?s.stop:pull,released=can&&pull>86;
      [...levels.children].forEach((b,i)=>{b.classList.toggle('active',i===index);b.classList.toggle('solved',solved.has(scenarios[i].id))});$('score').textContent=score+' / 4';$('kicker').textContent='关卡 '+(index+1)+' / 4';$('title').textContent=s.title;$('subtitle').textContent=s.sub;
      part.className='part '+s.id;part.style.setProperty('--lift',(visible*2.55)+'px');stage.className='stage '+s.id+'-scene'+(blocked?' blocked':'');core.className='core'+(s.id==='sidehole'?' show':'')+(coreOpen?' open':'');coreButton.className='core-btn'+(s.id==='sidehole'?' show':'')+(coreOpen?' on':'');coreButton.textContent=coreOpen?'侧芯已退出，可以主拔模':'第一步：点击退出侧芯';
      status.className='status'+(blocked?' bad':released?' good':'');status.textContent=blocked?'发生干涉':released?'顺利脱模':'等待操作';$('percent').textContent=pull+'%';$('pullLabel').textContent=blocked?'继续拉也不会移动':'向上拔模';explain.className='explain'+(blocked?' bad':released?' good':'');$('explainTitle').textContent=blocked?'卡在红色干涉区':released?'脱模完成':'实验提示';$('explainBody').textContent=blocked?s.rule:released?(s.id==='sidehole'?'动作顺序正确：侧芯先退出，零件再主拔模。':'侧壁越往出口越松，零件可以沿直线退出。'):(s.id==='sidehole'&&!coreOpen?'先尝试直接向上拔，再退出侧芯对比结果。':'拖动滑杆，观察零件与模具的相对运动。');
    }
    slider.oninput=e=>{pull=Number(e.target.value);render()};coreButton.onclick=()=>{coreOpen=!coreOpen;pull=0;slider.value=0;render()};$('next').onclick=()=>select((index+1)%scenarios.length);
    document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const s=scenarios[index],value=b.dataset.answer,ok=value===s.answer;if(ok&&!solved.has(s.id)){solved.add(s.id);score++}document.querySelectorAll('.answers button').forEach(x=>x.disabled=true);const f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML='<b>'+(ok?'判断正确':'再看一次结构轮廓')+'</b><br>'+(ok?s.rule:'答案是：'+(s.answer==='direct'?'可以直接拔':'需要侧向机构')+'。拖动滑杆验证。');render()});
    render();
  </script>
</body>
</html>
